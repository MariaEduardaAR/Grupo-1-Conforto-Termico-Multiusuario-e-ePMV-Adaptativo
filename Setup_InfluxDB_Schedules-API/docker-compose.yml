version: '3.8'
services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb_tsdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin
      - DOCKER_INFLUXDB_INIT_ORG=ufc_quixada
      - DOCKER_INFLUXDB_INIT_BUCKET=instrumentacao_2026
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=token-api-grupo1-2026
    volumes:
      - influxdb_data:/var/lib/influxdb2

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto_broker
    ports:
      - "1883:1883"
      - "9001:9001"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb

volumes:
  influxdb_data: